<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Настройки переводчика</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: white;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background: #0056b3;
        }
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        .btn-secondary:hover {
            background: #545b62;
        }
    </style>
</head>
<body>
    <h2>⚙ Настройки переводчика</h2>
    
    <div class="form-group">
        <label for="device-select">Устройство ввода (Loopback):</label>
        <select id="device-select">
            <option value="0">Загрузка...</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="model-select">Модель распознавания:</label>
        <select id="model-select">
            <option value="tiny">Tiny (быстрая, менее точная)</option>
            <option value="base">Base (средняя)</option>
            <option value="small">Small (точная, медленная)</option>
            <option value="medium">Medium (очень точная, медленная)</option>
        </select>
    </div>
    
    <div class="btn-group">
        <button class="btn-secondary" id="cancel-btn">Отмена</button>
        <button class="btn-primary" id="save-btn">Применить и перезапустить</button>
    </div>
    
    <script src="settings.js"></script>
</body>
</html>
