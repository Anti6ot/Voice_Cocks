name: Build and Release

on:
  push:
    tags:
      - 'v*'  # запускается при создании тега вида v1.0.0, v1.1.0 и т.д.
  workflow_dispatch:  # позволяет запускать вручную из веб-интерфейса GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download translation model (ctranslate2)
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='ooeoeo/opus-mt-en-ru-ct2-float16', local_dir='models/opus-mt-en-ru', ignore_patterns=['*.git*', '*.md'])"

      - name: Build Python backend (exe)
        run: |
          pyinstaller --onefile --noconfirm --name voicecocks-backend `
            --add-data "models;models" `
            --collect-all ctranslate2 `
            --collect-all faster_whisper `
            --collect-all sentencepiece `
            --collect-all av `
            --collect-all onnxruntime `
            --collect-all tokenizers `
            --collect-all pyaudiowpatch `
            --collect-all webrtcvad `
            --collect-all huggingface_hub `
            --hidden-import=websockets `
            --hidden-import=config_server `
            server.py

      - name: Install Electron dependencies
        working-directory: overlay
        run: npm install

      - name: Build Electron installer
        working-directory: overlay
        run: npx electron-builder --win --publish never

      - name: Verify build output
        run: |
          dir dist\voicecocks-backend.exe
          dir overlay\dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            overlay/dist/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
