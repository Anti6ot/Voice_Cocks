name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Запускается ТОЛЬКО при создании тега вида v1.0.0, v1.1.0 и т.д.
  workflow_dispatch:  # Позволяет запускать вручную из веб-интерфейса GitHub

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --force-reinstall setuptools
          pip install pyinstaller
      
      - name: 🔨 Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name VoiceCocks `
            --hidden-import=ctranslate2 `
            --hidden-import=faster_whisper `
            --hidden-import=sentencepiece `
            --hidden-import=huggingface_hub `
            --hidden-import=webrtcvad `
            --hidden-import=pkg_resources `
            --collect-all ctranslate2 `
            --collect-all sentencepiece `
            --collect-all setuptools `
            --copy-metadata setuptools `
            main.py


      - name: 📤 Verify build output
        run: |
          dir dist\VoiceCocks.exe
      
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/VoiceCocks.exe
          name: "VoiceCocks ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}